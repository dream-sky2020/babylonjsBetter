<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玻璃交互模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 模拟玻璃后的背景，增强透明感 */
        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            z-index: 1;
        }

        /* 玻璃 Canvas */
        #glass-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: pointer;
        }

        /* 控制面板 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn.active {
            background: #ffffff;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .btn-reset {
            background: rgba(255, 77, 77, 0.4);
        }
        .btn-reset:hover {
            background: rgba(255, 77, 77, 0.7);
        }

        /* 提示说明 */
        .tip {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="bg-image"></div>
    <canvas id="glass-canvas"></canvas>

    <!-- 控制面板：用于切换不同的模式和清除效果 -->
    <div class="control-panel">
        <button class="btn active" onclick="setMode('shatter', this)">🔨 击碎玻璃</button>
        <button class="btn" onclick="setMode('ink', this)">🖋️ 泼洒水墨</button>
        <button class="btn" onclick="setMode('blood', this)">🩸 泼洒血迹</button>
        <button class="btn btn-reset" onclick="clearGlass()">🧹 清理玻璃</button>
    </div>

    <div class="tip">点击屏幕任意位置触发效果</div>

    <script>
        const canvas = document.getElementById('glass-canvas');
        const ctx = canvas.getContext('2d');

        let currentMode = 'shatter'; // 默认模式：击碎

        // 调整 Canvas 尺寸适应屏幕
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawGlassTexture();
        }

        // 初始化绘制微弱的玻璃高光/反光
        function drawGlassTexture() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 玻璃边沿斜光
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
            gradient.addColorStop(0.5, 'transparent');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0.05)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 切换模式
        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.control-panel .btn').forEach(b => {
                if(!b.classList.contains('btn-reset')) b.classList.remove('active');
            });
            btn.classList.add('active');
        }

        // 清空玻璃效果
        function clearGlass() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGlassTexture();
        }

        // 点击事件绑定
        canvas.addEventListener('click', (e) => {
            const x = e.clientX;
            const y = e.clientY;

            switch(currentMode) {
                case 'shatter':
                    drawShatter(x, y);
                    break;
                case 'ink':
                    drawSplash(x, y, '#111111', 'ink');
                    break;
                case 'blood':
                    drawSplash(x, y, '#8b0000', 'blood');
                    break;
            }
        });

        // ----------------- 模式1：击碎玻璃效果 -----------------
        function drawShatter(x, y) {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            ctx.shadowBlur = 4;

            // 1. 绘制放射状主裂纹
            const lines = Math.floor(Math.random() * 6) + 8;
            for (let i = 0; i < lines; i++) {
                let angle = (Math.PI * 2 / lines) * i + (Math.random() * 0.4 - 0.2);
                let length = Math.random() * 150 + 80;
                let curX = x;
                let curY = y;

                ctx.beginPath();
                ctx.moveTo(curX, curY);

                let segments = 5;
                for (let j = 0; j < segments; j++) {
                    let segLen = length / segments;
                    curX += Math.cos(angle) * segLen + (Math.random() * 10 - 5);
                    curY += Math.sin(angle) * segLen + (Math.random() * 10 - 5);
                    ctx.lineWidth = Math.max(0.5, 2.5 - j * 0.4);
                    ctx.lineTo(curX, curY);
                }
                ctx.stroke();
            }

            // 2. 绘制环状蛛网裂纹
            const rings = Math.floor(Math.random() * 3) + 3;
            for (let r = 1; r <= rings; r++) {
                let radius = r * (Math.random() * 20 + 20);
                ctx.beginPath();
                ctx.lineWidth = 1;
                for (let a = 0; a <= Math.PI * 2; a += 0.3) {
                    let rX = x + Math.cos(a) * (radius + Math.random() * 8 - 4);
                    let rY = y + Math.sin(a) * (radius + Math.random() * 8 - 4);
                    if (a === 0) ctx.moveTo(rX, rY);
                    else ctx.lineTo(rX, rY);
                }
                ctx.closePath();
                ctx.stroke();
            }

            // 3. 击穿中心白色破损区
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(x, y, Math.random() * 6 + 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // ----------------- 模式2 & 3：泼洒液体效果（水墨 / 血迹） -----------------
        function drawSplash(x, y, color, type) {
            ctx.save();
            ctx.fillStyle = color;

            // 中心大斑点
            const mainRadius = Math.random() * 20 + 25;
            ctx.beginPath();
            ctx.arc(x, y, mainRadius, 0, Math.PI * 2);
            ctx.fill();

            // 周围飞溅的小斑点和长线条（流淌效果）
            const dropCount = Math.floor(Math.random() * 20) + 25;
            for (let i = 0; i < dropCount; i++) {
                let angle = Math.random() * Math.PI * 2;
                let dist = Math.random() * 80 + mainRadius;
                let dropX = x + Math.cos(angle) * dist;
                let dropY = y + Math.sin(angle) * dist;
                let dropRadius = Math.random() * 6 + 1;

                ctx.beginPath();
                ctx.arc(dropX, dropY, dropRadius, 0, Math.PI * 2);
                ctx.fill();

                // 连线水滴（从中心往外溅射）
                if (Math.random() > 0.5) {
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(dropX, dropY);
                    ctx.lineWidth = Math.random() * 3 + 1;
                    ctx.strokeStyle = color;
                    ctx.stroke();
                }
            }

            // 模拟重力流淌效果（往下滴）
            const dripCount = Math.floor(Math.random() * 3) + 2;
            for (let d = 0; d < dripCount; d++) {
                let dripX = x + (Math.random() * mainRadius - mainRadius / 2);
                let dripLength = Math.random() * 100 + 40;
                
                ctx.beginPath();
                ctx.moveTo(dripX, y);
                
                // 控制曲线滴落
                ctx.quadraticCurveTo(
                    dripX + (Math.random() * 10 - 5), 
                    y + dripLength / 2, 
                    dripX, 
                    y + dripLength
                );
                
                ctx.lineWidth = Math.random() * 4 + 2;
                ctx.strokeStyle = color;
                ctx.lineCap = 'round';
                ctx.stroke();

                // 滴落末端的小圆点
                ctx.beginPath();
                ctx.arc(dripX, y + dripLength, ctx.lineWidth / 1.2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }
    </script>
</body>
</html>
