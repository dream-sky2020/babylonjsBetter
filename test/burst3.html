<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆头实心胶囊-彩描边爆炸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050508;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            font-family: sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .hint {
            position: relative;
            z-index: 2;
            pointer-events: none;
            color: #64748b;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="hint">点击屏幕爆发圆头长条</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class RoundedRay {
            constructor(x, y, angle, mainColor, strokeColor) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                
                // 爆发速度与减速
                this.speed = Math.random() * 20 + 15;
                this.friction = 0.91;
                
                // 尺寸设定
                this.length = Math.random() * 90 + 70;  // 较长的长条
                this.thickness = Math.random() * 5 + 6;  // 线条粗细
                
                this.life = 1.0;
                this.decay = Math.random() * 0.025 + 0.02;
                
                this.mainColor = mainColor;     // 内部填充颜色（彩色/亮色）
                this.strokeColor = strokeColor; // 外边缘描边颜色
            }

            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                
                this.speed *= this.friction;
                this.life -= this.decay;
            }

            draw() {
                if (this.life <= 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = Math.max(0, this.life);

                const currentLen = this.length * (this.speed / 18 + 0.5);

                // --- 第一层：外描边（比内部线稍粗，形成外框）---
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(currentLen, 0);
                ctx.strokeStyle = this.strokeColor;
                ctx.lineWidth = this.thickness + 3; // 描边宽度
                ctx.lineCap = 'round';              // 两端绝对圆头
                ctx.stroke();

                // --- 第二层：内部实心彩色填充 ---
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(currentLen, 0);
                ctx.strokeStyle = this.mainColor;   // 实心填充色
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';              // 两端绝对圆头
                ctx.stroke();

                // --- 第三层（可选）：核心高亮细线，增加亮感 ---
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(currentLen * 0.7, 0);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(1.5, this.thickness - 4);
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.restore();
            }
        }

        let particles = [];

        function triggerExplosion(x, y) {
            // 配色方案：[内部实心色, 外描边色]
            const colorPairs = [
                { main: '#00f0ff', stroke: '#ffffff' }, // 亮青内芯 + 白描边
                { main: '#ff0055', stroke: '#000000' }, // 亮粉内芯 + 黑描边
                { main: '#ffea00', stroke: '#000000' }, // 鲜黄内芯 + 黑描边
                { main: '#00ff66', stroke: '#ffffff' }, // 荧光绿内芯 + 白描边
                { main: '#ffffff', stroke: '#ff0055' }  // 纯白内芯 + 霓虹粉描边
            ];
            
            const pair = colorPairs[Math.floor(Math.random() * colorPairs.length)];
            const count = 28;

            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.08 - 0.04);
                particles.push(new RoundedRay(x, y, angle, pair.main, pair.stroke));
            }
        }

        window.addEventListener('click', (e) => {
            triggerExplosion(e.clientX, e.clientY);
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
