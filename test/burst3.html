<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆头实心胶囊-彩描边爆炸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050508;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            font-family: sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .hint {
            position: relative;
            z-index: 2;
            pointer-events: none;
            color: #64748b;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="hint">点击屏幕爆发胶囊射线</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const capsules = [];

        const controls = {
            spawnCount: 36,
            spawnJitter: 0.1,
            colorPairs: [
                { main: '#00f0ff', stroke: '#ffffff' },
                { main: '#ff0055', stroke: '#111111' },
                { main: '#ffea00', stroke: '#111111' },
                { main: '#00ff66', stroke: '#ffffff' },
                { main: '#ffffff', stroke: '#ff0055' }
            ]
        };

        function createDefaultControllers() {
            function initCapsule(originX, originY, angle, colors) {
                return {
                    originX,
                    originY,
                    x: originX,
                    y: originY,
                    angle,
                    speed: Math.random() * 25 + 15,
                    friction: 0.92,
                    phase: Math.random() * Math.PI * 2,
                    length: Math.random() * 80 + 60,
                    thickness: Math.random() * 3 + 4,
                    life: 1,
                    decay: Math.random() * 0.03 + 0.03,
                    mainColor: colors.main,
                    strokeColor: colors.stroke
                };
            }

            function drawCapsule(capsule, px, py, rotation, alpha, now) {
                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(rotation);
                ctx.globalAlpha = alpha;

                const len = capsule.length * (capsule.speed / 20 + 0.5);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(len, 0);
                ctx.strokeStyle = capsule.strokeColor;
                ctx.lineWidth = capsule.thickness + 3;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(len, 0);
                ctx.strokeStyle = capsule.mainColor;
                ctx.lineWidth = capsule.thickness;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.restore();
            }

            return {
                // 可插拔入口1：点击后如何生成
                spawnController(target, x, y, settings) {
                    const pair = settings.colorPairs[Math.floor(Math.random() * settings.colorPairs.length)];
                    for (let i = 0; i < settings.spawnCount; i++) {
                        const base = (Math.PI * 2 / settings.spawnCount) * i;
                        const jitter = Math.random() * settings.spawnJitter - settings.spawnJitter * 0.5;
                        target.push(initCapsule(x, y, base + jitter, pair));
                    }
                },

                // 可插拔入口2：每帧如何移动
                motionController(capsule, now) {
                    capsule.x += Math.cos(capsule.angle) * capsule.speed;
                    capsule.y += Math.sin(capsule.angle) * capsule.speed;
                    capsule.speed *= capsule.friction;
                    capsule.life -= capsule.decay;
                },

                // 可插拔入口3：如何绘制（当前为爆炸直射胶囊）
                renderController(capsule, now, settings) {
                    if (capsule.life <= 0) return;
                    const alpha = Math.max(0, capsule.life);
                    drawCapsule(capsule, capsule.x, capsule.y, capsule.angle, alpha, now);
                }
            };
        }

        // 你可以把 controllers 的三个入口函数替换成自己的实现
        const controllers = createDefaultControllers();

        function triggerPattern(x, y) {
            controllers.spawnController(capsules, x, y, controls);
        }

        window.addEventListener('click', (e) => {
            triggerPattern(e.clientX, e.clientY);
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);
            const now = performance.now();

            for (let i = capsules.length - 1; i >= 0; i--) {
                controllers.motionController(capsules[i], now, controls);
                controllers.renderController(capsules[i], now, controls);
                if (capsules[i].life <= 0) {
                    capsules.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
