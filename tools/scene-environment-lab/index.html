<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene Environment Lab</title>

  </head>
  <body>
    <div class="layout scene-workbench">
      <div id="scene-hierarchy"></div>
      <div id="scene-inspector"></div>
      <aside class="scene-domain">
        <h1>Scene Environment Lab</h1>
        <div class="hint">验证 Map Entity 的 SceneEnvironmentComponent 通过 presetKey 加载 JSON 场景预设。</div>
        <div class="card">
          <label for="preset">场景预设</label>
          <select id="preset"></select>
          <button id="load" type="button">应用 / 重载当前草稿</button><button id="save-preset" type="button">保存预设 / 正式构建导出</button>
          <label class="scene-key-label" for="current-scene-key">当前展示的场景 Key</label>
          <div class="key-copy-row">
            <input id="current-scene-key" type="text" readonly spellcheck="false" aria-label="当前展示的场景 Key" />
            <button id="copy-scene-key" type="button">复制</button>
          </div>
          <div class="switch-row">
            <label for="csm-debug">阴影级联 Debug</label>
            <input id="csm-debug" type="checkbox" />
          </div>
          <div id="csm-debug-hint" class="switch-hint">用不同颜色显示 CSM 的各个 cascade。</div>
          <div id="status" class="status" style="margin-top:10px">正在读取场景预设……</div>
        </div>
        <div class="card">
          <label>测试组件数据</label>
          <pre id="component-json"></pre>
        </div>
        <div class="card">
          <label>已解析的预设数据</label>
          <pre id="preset-json"></pre>
        </div>
        <p class="hint"><a href="../../index.html">返回工具入口</a></p>
      </aside>
      <main id="stage"><div id="scene-toolbar"></div>
        <canvas id="preview"></canvas>
        <div class="badge">使用摄像机控制面板切换视角 · WASDQE 移动</div>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
