<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Player Spawn Lab</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 820px; height: 100vh; overflow: hidden; background: #080d12; color: #e2edf5; }
      .layout { display: grid; grid-template-columns: 370px minmax(0, 1fr); height: 100%; }
      aside { overflow: auto; padding: 18px; border-right: 1px solid #273747; background: #101820; }
      h1 { margin: 0 0 7px; font-size: 21px; }
      .hint, .status { color: #91a7b8; font-size: 12px; line-height: 1.55; }
      .card { margin-top: 15px; padding: 13px; border: 1px solid #314659; background: #14212b; }
      label { display: block; margin: 0 0 6px; color: #a9bfd0; font-size: 12px; }
      select, button { width: 100%; height: 36px; border: 1px solid #48677e; border-radius: 0; background: #0d1821; color: #edf8ff; }
      select { padding: 0 9px; }
      button { margin-top: 9px; cursor: pointer; background: #6b5521; font-weight: 700; }
      button:hover { background: #8b702b; }
      .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding-top: 11px; border-top: 1px solid #314659; }
      .switch-row label { margin: 0; cursor: pointer; }
      .switch-row input { width: 18px; height: 18px; margin: 0; accent-color: #ffd34e; cursor: pointer; }
      pre { max-height: 310px; margin: 0; overflow: auto; padding: 10px; background: #091118; color: #bfd0dc; font: 11px/1.5 Consolas, monospace; white-space: pre-wrap; }
      main { position: relative; min-width: 0; min-height: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .badge { position: absolute; top: 14px; right: 14px; padding: 7px 10px; border: 1px solid #7d6b38; background: rgba(17, 15, 8, .88); color: #ffe69a; font-size: 12px; pointer-events: none; }
      a { color: #71c5ee; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside>
        <h1>玩家出生点世界位置 Lab</h1>
        <div class="hint">复用地牢大场景加载能力，读取地图容器中的 spawn-point / actor-spawn，并结合 map Entity 的场景布局计算 3D 位置。</div>
        <div class="card">
          <label for="map-preset">地图预设</label>
          <select id="map-preset"></select>
          <button id="load" type="button">加载场景并解析玩家出生点</button>
          <div class="switch-row">
            <label for="map-debug">显示全部格子 Debug 盒</label>
            <input id="map-debug" type="checkbox" />
          </div>
          <div class="switch-row">
            <label for="spawn-debug">显示玩家出生格 Debug 盒</label>
            <input id="spawn-debug" type="checkbox" />
          </div>
          <div id="status" class="status" style="margin-top:10px">正在读取配置……</div>
        </div>
        <div class="card">
          <label>出生点解析结果</label>
          <pre id="spawn-json">尚未解析</pre>
        </div>
        <div class="card">
          <label>地图实体与场景布局组件</label>
          <pre id="map-json">尚未解析</pre>
        </div>
        <p class="hint"><a href="../../index.html">返回工具入口</a></p>
      </aside>
      <main>
        <canvas id="preview"></canvas>
        <div class="badge">spawn-point → actor-spawn → map Entity 布局 → 3D 世界位置</div>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
