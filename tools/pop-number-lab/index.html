<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pop Number Lab</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      grid-template-columns: 340px 1fr;
      grid-template-rows: minmax(0, 1fr);
      background: #0b1220;
      color: #e2e8f0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    .panel {
      border-right: 1px solid #243046;
      background: #111827;
      padding: 14px;
      overflow: auto;
      min-height: 0;
    }

    .title {
      margin: 0;
      font-size: 18px;
      color: #7dd3fc;
    }

    .hint {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }

    .group {
      margin-top: 14px;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
    }

    .label {
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 12px;
    }

    input,
    select,
    button {
      width: 100%;
      border: 1px solid #3b4c67;
      border-radius: 6px;
      background: #0b1220;
      color: #e2e8f0;
      padding: 6px 8px;
      font-size: 13px;
    }

    input[type="checkbox"] {
      width: auto;
      transform: translateY(1px);
      margin-right: 6px;
    }

    button {
      cursor: pointer;
      background: #1f2e47;
    }

    button:hover {
      background: #2a3c5b;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .row>.col {
      flex: 1;
    }

    .direction-visual {
      margin-top: 10px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0b1220;
      padding: 8px;
    }

    .direction-visual svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .direction-legend {
      margin-top: 6px;
      color: #93c5fd;
      font-size: 12px;
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      color: #dbeafe;
      font-size: 13px;
    }

    .status {
      margin-top: 10px;
      min-height: 18px;
      color: #93c5fd;
      font-size: 12px;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      background: radial-gradient(circle at 40% 40%, #111b2f 0%, #0a0f1a 70%);
      overflow: hidden;
      cursor: pointer;
    }

    .stage-hint {
      position: absolute;
      left: 12px;
      top: 12px;
      color: #94a3b8;
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      pointer-events: none;
    }

    .number-box {
      position: absolute;
      border-radius: 0;
      border: 2px solid var(--num-color, #38bdf8);
      background-color: rgba(15, 23, 42, 0.88);
      color: var(--num-color, #38bdf8);
      padding: 8px 18px;
      font-size: 28px;
      font-weight: 700;
      font-family: "Courier New", Courier, monospace;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: spawn var(--life-ms, 800ms) ease-out forwards;
      box-shadow: 0 0 16px color-mix(in srgb, var(--num-color, #38bdf8) 25%, transparent);
    }

    .number-box.no-glow {
      box-shadow: none;
    }

    .number-box.projectile {
      animation: none;
      opacity: 1;
    }

    @keyframes spawn {
      0% {
        opacity: 0;
        transform: translate(-50%, -30%) scale(0.9);
      }

      20% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      80% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -70%) scale(0.95);
      }
    }
  </style>
</head>

<body>
  <aside class="panel">
    <h1 class="title">Pop Number Lab</h1>
    <div class="hint">点击右侧区域触发弹出数字。修改参数后立即生效。</div>

    <div class="group">
      <div class="label">弹出模式</div>
      <select id="popMode">
        <option value="float">原始上浮</option>
        <option value="projectile">随机方向抛射（重力）</option>
      </select>
    </div>

    <div id="projectileControls" class="group" style="display:none">
      <div class="label">方向范围（角度，右=0，上=-90）</div>
      <div class="row">
        <div class="col">
          <div class="label">最小角度</div>
          <input id="directionMinDeg" type="number" value="-120" step="1" />
        </div>
        <div class="col">
          <div class="label">最大角度</div>
          <input id="directionMaxDeg" type="number" value="-60" step="1" />
        </div>
      </div>

      <div class="label" style="margin-top:8px">速度范围（px/s）</div>
      <div class="row">
        <div class="col">
          <div class="label">最小速度</div>
          <input id="speedMin" type="number" value="260" step="10" min="0" />
        </div>
        <div class="col">
          <div class="label">最大速度</div>
          <input id="speedMax" type="number" value="460" step="10" min="0" />
        </div>
      </div>

      <div class="label" style="margin-top:8px">重力（px/s²）</div>
      <input id="gravity" type="number" value="900" step="10" />

      <div class="direction-visual">
        <svg id="directionRangeSvg" viewBox="0 0 200 200" aria-label="方向范围预览">
          <circle cx="100" cy="100" r="72" fill="none" stroke="#ffffff" stroke-width="2" />
          <path id="directionRangeSector" fill="rgba(56, 189, 248, 0.45)"></path>
          <line id="directionRangeStart" x1="100" y1="100" x2="100" y2="28" stroke="#60a5fa" stroke-width="2"></line>
          <line id="directionRangeEnd" x1="100" y1="100" x2="172" y2="100" stroke="#60a5fa" stroke-width="2"></line>
          <circle cx="100" cy="100" r="2.5" fill="#ffffff"></circle>
        </svg>
        <div id="directionRangeLabel" class="direction-legend"></div>
      </div>
    </div>

    <div class="group">
      <div class="label">数字模式</div>
      <select id="numberMode">
        <option value="range">随机范围</option>
        <option value="fixed">固定数值</option>
      </select>

      <div id="rangeControls" class="row">
        <div class="col">
          <div class="label">最小值</div>
          <input id="minValue" type="number" value="1000" step="1" />
        </div>
        <div class="col">
          <div class="label">最大值</div>
          <input id="maxValue" type="number" value="9999" step="1" />
        </div>
      </div>

      <div id="fixedControls" class="row" style="display:none">
        <div class="col">
          <div class="label">固定值</div>
          <input id="fixedValue" type="number" value="7777" step="1" />
        </div>
      </div>
    </div>

    <div class="group">
      <div class="label">消失时间（毫秒） <span id="lifeMsValue">800</span></div>
      <input id="lifeMs" type="range" min="200" max="3000" step="50" value="800" />
    </div>

    <div class="group">
      <label class="checkbox-line">
        <input id="enableGlow" type="checkbox" checked />
        启用发光
      </label>
    </div>

    <div class="group">
      <div class="label">测试</div>
      <div class="row">
        <div class="col"><button id="spawnCenterBtn" type="button">中心弹出</button></div>
        <div class="col"><button id="clearBtn" type="button">清空</button></div>
      </div>
    </div>

    <div id="status" class="status"></div>
  </aside>

  <main id="stage" class="stage">
    <div class="stage-hint">点击任意位置生成数字</div>
  </main>

  <script type="module" src="./main.js"></script>
</body>

</html>
