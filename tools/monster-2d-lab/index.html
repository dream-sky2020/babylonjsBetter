<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Monster Lab</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0f131a;
      color: #e8edf2;
    }

    .root {
      height: 100vh;
      display: grid;
      grid-template-columns: 360px minmax(320px, 1fr) 420px;
      gap: 10px;
      padding: 10px;
    }

    .panel {
      background: #171b24;
      border: 1px solid #2a3344;
      border-radius: 10px;
      padding: 12px;
      overflow: auto;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
    }

    .hint {
      margin-top: 4px;
      color: #8fa0b5;
      font-size: 12px;
      line-height: 1.5;
    }

    .row {
      margin-top: 12px;
    }

    .label {
      margin-bottom: 4px;
      color: #8fa0b5;
      font-size: 12px;
    }

    input,
    select,
    button {
      width: 100%;
      background: #0f131a;
      color: #e8edf2;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
    }

    button {
      cursor: pointer;
      background: #243044;
    }

    .preview-wrap {
      min-height: 0;
    }

    #preview {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 10px;
      border: 1px solid #2a3344;
      background: #090c11;
      cursor: grab;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #9fb0c5;
      line-height: 1.4;
    }

    .sub-card {
      margin-top: 8px;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      background: #111722;
    }

    .segment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .segment-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .warn {
      background: #3b1720;
      border-color: #7f1d1d;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      background: #0f131a;
      color: #c5d1e0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      resize: vertical;
    }
  </style>
</head>

<body>
  <main class="root">
    <section class="panel">
      <div class="title">2D 网页预览效果</div>
      <div class="hint">
        当前是 2D Canvas 预览页；左右面板与 3D 页共用。
      </div>

      <div class="row segment-grid">
        <button id="go2dPageBtn">当前：2D 预览页</button>
        <button id="go3dPageBtn">切到 Babylon3D 场景页</button>
      </div>

      <div class="row">
        <button id="loadMonsterConfigsBtn">从服务器读取怪物配置</button>
      </div>
      <div class="row">
        <button id="saveMonsterConfigsBtn">保存怪物配置到服务器</button>
        <div id="statusText" class="status"></div>
      </div>

      <div class="row">
        <div class="label">怪物显示配置</div>
        <select id="monsterConfigSelect"></select>
      </div>
      <div class="row">
        <div class="label">配置 ID（唯一）</div>
        <input id="monsterIdInput" type="text" placeholder="monster_default" />
      </div>
      <div class="row">
        <div class="label">配置名称</div>
        <input id="monsterNameInput" type="text" placeholder="默认怪物展示" />
      </div>
      <div class="row">
        <div class="label">怪物条纹预设绑定</div>
        <select id="monsterStripePresetBindingSelect"></select>
      </div>
      <div class="row">
        <button id="newMonsterConfigBtn">新建配置</button>
      </div>
      <div class="row">
        <button id="duplicateMonsterConfigBtn">复制当前配置</button>
      </div>
      <div class="row">
        <button id="deleteMonsterConfigBtn">删除当前配置</button>
      </div>

      <div class="row">
        <div class="label">每层配置</div>
        <div id="layersBox"></div>
      </div>

      <div class="row">
        <button id="reloadImagesBtn">重载当前图片与配置</button>
      </div>

      <div class="row">
        <div class="label">怪物大小</div>
        <input id="sizeInput" type="range" min="240" max="900" step="1" value="560" />
      </div>

      <div class="row">
        <div class="label">2D 预览背景色</div>
        <input id="previewBgInput" type="color" value="#0b0f16" />
      </div>

      <div class="row">
        <button id="resetPositionBtn">恢复原位</button>
      </div>

      <datalist id="monsterAssetList"></datalist>
    </section>
    <section class="preview-wrap">
      <canvas id="preview"></canvas>
    </section>
    <section class="panel">
      <div class="title">条纹配置编辑</div>
      <div class="hint">这里只编辑怪物条纹预设：仅包含 id、name、以及每个图层引用哪个已有条纹预设。</div>

      <div class="row">
        <button id="reloadStripeBtn">刷新可用条纹预设（stripePresets.json）</button>
      </div>

      <div class="row">
        <button id="reloadMonsterStripePresetBtn">读取怪物条纹预设</button>
      </div>
      <div class="row">
        <button id="saveMonsterStripePresetBtn">保存怪物条纹预设</button>
      </div>
      <div class="row">
        <div class="label">怪物条纹预设</div>
        <select id="monsterStripePresetSelect"></select>
      </div>
      <div class="row">
        <div class="label">怪物条纹 presetKey（唯一）</div>
        <input id="monsterStripePresetKeyInput" type="text" placeholder="monster_stripe_key" />
      </div>
      <div class="row">
        <button id="renameMonsterStripePresetBtn">修改怪物条纹 presetKey</button>
      </div>
      <div class="row">
        <button id="newMonsterStripePresetBtn">新建怪物条纹预设</button>
      </div>
      <div class="row">
        <button id="duplicateMonsterStripePresetBtn">复制怪物条纹预设</button>
      </div>
      <div class="row">
        <button id="deleteMonsterStripePresetBtn" class="warn">删除怪物条纹预设</button>
      </div>
      <div class="row">
        <div class="label">怪物条纹显示名</div>
        <input id="monsterStripePresetNameInput" type="text" />
      </div>
      <div class="row">
        <div class="label">图层条纹分配（由怪物条纹预设决定）</div>
        <div id="layerStripeBox"></div>
      </div>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>

</html>
