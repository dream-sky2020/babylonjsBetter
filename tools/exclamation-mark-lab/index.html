<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exclamation Mark Sprite Lab</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #0a0f17; color: #e8edf5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select { font: inherit; }
    button { border: 1px solid #3a4961; border-radius: 7px; padding: 7px 10px; color: #e8edf5; background: #24324a; cursor: pointer; }
    button:hover { background: #304263; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    input, select { width: 100%; border: 1px solid #344157; border-radius: 7px; padding: 8px 9px; color: #e8edf5; background: #101722; }
    label { display: block; margin: 9px 0 5px; color: #aab7ca; font-size: 12px; }
  </style>
</head>

  <div id="root"></div>
  <script type="module" src="/tools/exclamation-mark-lab/exclamationMarkLabMain.tsx"></script>
</body>
</html>
