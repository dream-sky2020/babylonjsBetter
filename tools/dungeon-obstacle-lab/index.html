<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Obstacle Lab</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 820px; height: 100vh; overflow: hidden; background: #080d12; color: #e2edf5; }
      .layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); height: 100%; }
      aside { overflow: auto; padding: 18px; border-right: 1px solid #273747; background: #101820; }
      h1 { margin: 0 0 7px; font-size: 21px; }
      .hint, .status { color: #91a7b8; font-size: 12px; line-height: 1.55; }
      .card { margin-top: 15px; padding: 13px; border: 1px solid #314659; background: #14212b; }
      label { display: block; margin: 0 0 6px; color: #a9bfd0; font-size: 12px; }
      select, input, button { width: 100%; height: 36px; border: 1px solid #48677e; border-radius: 0; background: #0d1821; color: #edf8ff; }
      select, input { padding: 0 9px; }
      button { margin-top: 9px; cursor: pointer; background: #245d7c; font-weight: 700; }
      button:hover { background: #2d7398; }
      .key-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 7px; margin-bottom: 9px; }
      .key-row button { margin: 0; }
      .key-row input { font: 12px Consolas, monospace; }
      .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding-top: 11px; border-top: 1px solid #314659; }
      .switch-row label { margin: 0; cursor: pointer; }
      .switch-row input { width: 18px; height: 18px; margin: 0; accent-color: #4db8e8; cursor: pointer; }
      .obstacle-list { display: grid; gap: 7px; }
      .obstacle-item { padding: 9px; border: 1px solid #344b5d; background: #0c161e; }
      .obstacle-item label { display: grid; grid-template-columns: 1fr 18px; gap: 8px; align-items: center; margin: 0; }
      .obstacle-item input { width: 18px; height: 18px; margin: 0; accent-color: #e35e4f; }
      .obstacle-item small { display: block; margin-top: 4px; color: #758b9b; font: 10px Consolas, monospace; }
      pre { max-height: 260px; margin: 0; overflow: auto; padding: 10px; background: #091118; color: #bfd0dc; font: 11px/1.5 Consolas, monospace; white-space: pre-wrap; }
      main { position: relative; min-width: 0; min-height: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .badge { position: absolute; top: 14px; right: 14px; padding: 7px 10px; border: 1px solid #526b7b; background: rgba(9, 17, 24, .86); color: #c7d8e3; font-size: 12px; pointer-events: none; }
      a { color: #71c5ee; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside>
        <h1>地牢阻碍系统 Lab</h1>
        <div class="hint">加载地牢大场景，扫描格子、独立边和公用边上的阻碍，将默认状态装入 DungeonRuntime，并在 3D 场景中显示近似位置。</div>
        <div class="card">
          <label for="map-preset">地图预设</label>
          <select id="map-preset"></select>
          <button id="load" type="button">读取地图组件并加载场景</button>
          <div class="switch-row">
            <label for="map-debug">显示全部格子 Debug 盒</label>
            <input id="map-debug" type="checkbox" />
          </div>
          <div class="switch-row">
            <label for="obstacle-debug">显示阻碍 Debug 盒</label>
            <input id="obstacle-debug" type="checkbox" />
          </div>
          <div id="status" class="status" style="margin-top:10px">正在读取配置……</div>
        </div>
        <div class="card">
          <label>Runtime 阻碍状态</label>
          <div id="obstacle-list" class="obstacle-list">尚未加载</div>
        </div>
        <div class="card">
          <label for="scene-key">解析出的场景 Key</label>
          <div class="key-row">
            <input id="scene-key" readonly spellcheck="false" />
            <button id="copy-key" type="button">复制</button>
          </div>
          <label>地图实体与环境组件</label>
          <pre id="binding-json">尚未解析</pre>
        </div>
        <div class="card">
          <label>加载的场景预设</label>
          <pre id="scene-json">尚未加载</pre>
        </div>
        <p class="hint"><a href="../../index.html">返回工具入口</a></p>
      </aside>
      <main id="stage">
        <canvas id="preview"></canvas>
        <div class="badge">地图阻碍 → obstacleStates → 近似 3D Debug 位置</div>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
