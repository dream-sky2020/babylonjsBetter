<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera Scene Lab</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #090c11;
        color: #e8edf2;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #preview {
        width: 100%;
        height: 100%;
        display: block;
        background: #090c11;
        cursor: grab;
      }
      .top-link {
        position: absolute;
        right: 16px;
        top: 16px;
        z-index: 10;
        padding: 8px 10px;
        border: 1px solid rgba(148, 163, 184, .35);
        border-radius: 8px;
        background: rgba(15, 19, 26, .72);
        color: #e8edf2;
        text-decoration: none;
        font: 12px "Segoe UI", "Microsoft YaHei", sans-serif;
        backdrop-filter: blur(8px);
      }
    </style>
  </head>
  <body>
    <main class="stage" id="stage">
      <canvas id="preview"></canvas>
      <a class="top-link" href="../../index.html">返回调试入口</a>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
