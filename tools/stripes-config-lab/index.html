<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stripes Config Lab</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #0f131a;
        color: #e8edf2;
      }
      .root {
        height: 100vh;
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 10px;
        padding: 10px;
      }
      .panel {
        background: #171b24;
        border: 1px solid #2a3344;
        border-radius: 10px;
        padding: 12px;
        overflow: auto;
      }
      .title {
        font-size: 16px;
        font-weight: 700;
      }
      .hint {
        margin-top: 4px;
        color: #8fa0b5;
        font-size: 12px;
      }
      .row {
        margin-top: 10px;
      }
      .top-link-btn {
        margin-top: 10px;
      }
      .label {
        margin-bottom: 4px;
        color: #8fa0b5;
        font-size: 12px;
      }
      input, select, button, textarea {
        width: 100%;
        background: #0f131a;
        color: #e8edf2;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 6px 8px;
      }
      button {
        cursor: pointer;
        background: #243044;
      }
      button.primary {
        background: #2f6fed;
        border-color: #2f6fed;
      }
      button.warn {
        background: #60222a;
        border-color: #7b2f39;
      }
      .btn-grid {
        margin-top: 8px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .segment {
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 8px;
        margin-top: 8px;
        background: #121722;
      }
      .segment-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .segment-grid-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      .preview-wrap {
        position: relative;
        min-height: 0;
      }
      #preview,
      #babylonPreview {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 10px;
        border: 1px solid #2a3344;
        background: #000;
      }
      #babylonPreview {
        display: none;
      }
      .status {
        margin-top: 8px;
        font-size: 12px;
        color: #9fb0c5;
      }
      textarea {
        margin-top: 8px;
        min-height: 120px;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <main class="root">
      <section class="panel">
        <div class="title">Stripes Config Lab</div>
        <div class="hint">用于配置怪物祝福条纹预设，支持保存到 config/stripePresets.json</div>
        <button id="openGalleryBtn" class="top-link-btn">打开卡片预览界面</button>

        <div class="row">
          <div class="label">预览模式</div>
          <select id="previewModeSelect">
            <option value="canvas2d">Canvas 2D（参考显示）</option>
            <option value="babylon">Babylon.js Shader 平面</option>
          </select>
        </div>

        <div class="row">
          <div class="label">预设</div>
          <select id="presetSelect"></select>
          <div class="btn-grid">
            <button id="newPresetBtn">新建预设</button>
            <button id="duplicatePresetBtn">复制当前</button>
          </div>
          <div class="btn-grid">
            <button id="deletePresetBtn" class="warn">删除当前</button>
            <button id="reloadBtn">从服务器重载</button>
          </div>
        </div>

        <div class="row">
          <div class="label">presetKey（按确认才生效）</div>
          <div class="btn-grid">
            <input id="presetKeyInput" type="text" placeholder="输入新的 presetKey" />
            <button id="renamePresetBtn">确认修改ID</button>
          </div>
        </div>

        <div class="row">
          <div class="label">配置名称（name）</div>
          <input id="nameInput" type="text" />
        </div>

        <div class="row">
          <div class="label">旋转角度 angleDeg（-360~360）</div>
          <input id="angleInput" type="number" step="0.1" />
        </div>

        <div class="row">
          <div class="label">移动速度 speed（px/s，可负数反向）</div>
          <input id="speedInput" type="number" step="1" />
        </div>

        <div class="row">
          <div class="label">背景色 background</div>
          <input id="backgroundInput" type="color" />
        </div>

        <div class="row">
          <div class="label">背景透明度 backgroundOpacity（0~1）</div>
          <input id="backgroundOpacityInput" type="number" min="0" max="1" step="0.05" />
        </div>

        <div class="row">
          <div class="label">模式 mode</div>
          <select id="modeInput">
            <option value="stripes">stripes（条纹）</option>
            <option value="solid">solid（纯色）</option>
          </select>
        </div>

        <div class="row" id="solidColorRow">
          <div class="label">纯色填充 solidColor</div>
          <input id="solidColorInput" type="color" />
        </div>

        <div class="row" id="solidOpacityRow">
          <div class="label">纯色透明度 solidOpacity（0~1）</div>
          <input id="solidOpacityInput" type="number" min="0" max="1" step="0.05" />
        </div>

        <div class="row">
          <div class="label">条纹组成 segments</div>
          <div id="segmentsBox"></div>
          <button id="addSegmentBtn" style="margin-top:8px">新增条纹段</button>
        </div>

        <div class="row">
          <button id="saveBtn" class="primary">保存到服务器（config/stripePresets.json）</button>
          <div class="status" id="statusText"></div>
        </div>

        <textarea id="jsonView" readonly></textarea>
      </section>

      <section class="preview-wrap">
        <canvas id="preview"></canvas>
        <canvas id="babylonPreview"></canvas>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
